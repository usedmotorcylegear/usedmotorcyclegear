<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Used Motorcycle Gear</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .orders-page { max-width: 860px; margin: 3rem auto; padding: 0 1.5rem; }
    .orders-section-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--text);
    }
    .order-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
    }
    .order-row img, .order-thumb-placeholder {
      width: 80px;
      height: 60px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .order-info { flex: 1; }
    .order-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.2rem; }
    .order-price { font-size: 1rem; font-weight: 800; margin-bottom: 0.2rem; }
    .order-meta { font-size: 0.82rem; color: var(--muted); }
    .order-status {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .status-pending   { background: #fff3cd; color: #856404; }
    .status-paid      { background: #d1ecf1; color: #0c5460; }
    .status-shipped   { background: #d4edda; color: #155724; }
    .status-delivered { background: #d4edda; color: #155724; }
    .status-complete  { background: #e2e3e5; color: #383d41; }
    .status-disputed  { background: #f8d7da; color: #721c24; }
    .tracking-note { font-size: 0.8rem; color: var(--success); margin-top: 0.3rem; font-weight: 600; }
    .empty-orders { padding: 3rem 0; text-align: center; color: var(--muted); font-size: 0.95rem; }
    .payout-note { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }
    .payout-ready { font-size: 0.8rem; color: var(--success); margin-top: 0.3rem; font-weight: 600; }
    .add-tracking-form { margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .add-tracking-form select, .add-tracking-form input { font-size: 0.82rem; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); }
    .add-tracking-form input { flex: 1; min-width: 140px; }
    .add-tracking-form button { font-size: 0.82rem; padding: 0.4rem 0.9rem; background: var(--text); color: #fff; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .add-tracking-form button:hover { background: var(--primary); }
    .dispute-btn { font-size: 0.78rem; margin-top: 0.5rem; padding: 0.3rem 0.7rem; background: none; border: 1px solid var(--danger); color: var(--danger); border-radius: 4px; cursor: pointer; }
    .dispute-btn:hover { background: var(--danger); color: #fff; }
    .dispute-form { margin-top: 0.6rem; }
    .dispute-form select, .dispute-form textarea { font-size: 0.82rem; width: 100%; margin-bottom: 0.4rem; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); }
    .dispute-form textarea { min-height: 60px; resize: vertical; }
    .dispute-form button { font-size: 0.82rem; padding: 0.4rem 0.9rem; background: var(--danger); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .dispute-note { font-size: 0.8rem; color: var(--danger); margin-top: 0.3rem; font-weight: 600; }
    .confirm-received-btn { font-size: 0.82rem; margin-top: 0.6rem; padding: 0.4rem 0.9rem; background: var(--success); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .confirm-received-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">used<span>motorcyclegear</span>.com</a>
  <ul class="nav-links">
    <li><a href="browse.html">Browse</a></li>
    <li><a href="how-it-works.html">How It Works</a></li>
    <li id="nav-auth-link"><a href="auth.html">Sign In</a></li>
    <li id="nav-messages-link" style="display:none"><a href="inbox.html">Messages</a></li>
    <li id="nav-orders-link" style="display:none"><a href="orders.html">Orders</a></li>
    <li><a href="post.html" class="btn-nav">+ Sell Gear</a></li>
  </ul>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="orders-page">
  <div id="orders-content"><div class="loading">Loading...</div></div>
</div>

<footer>
  <div>&copy; 2026 usedmotorcyclegear.com &mdash; Ride safe.</div>
  <div style="margin-top:0.5rem;"><a href="terms.html">Terms of Service</a> &nbsp;&middot;&nbsp; <a href="privacy.html">Privacy Policy</a></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  async function load() {
    const user = await requireAuth();
    const container = document.getElementById('orders-content');

    const [{ data: purchases }, { data: sales }] = await Promise.all([
      supabase.from('orders').select('*, listings(title, images)').eq('buyer_id', user.id).order('created_at', { ascending: false }),
      supabase.from('orders').select('*, listings(title, images)').eq('seller_id', user.id).order('created_at', { ascending: false })
    ]);

    const hasPurchases = purchases && purchases.length > 0;
    const hasSales = sales && sales.length > 0;

    if (!hasPurchases && !hasSales) {
      container.innerHTML = `<div class="empty-orders"><p>No orders yet.</p><a href="browse.html" class="btn btn-primary" style="margin-top:1rem; display:inline-block;">Browse Gear</a></div>`;
      return;
    }

    let html = '';

    if (hasPurchases) {
      html += `<section style="margin-bottom:3rem;">
        <div class="orders-section-title">My Orders</div>
        ${purchases.map(order => orderRow(order, 'purchase')).join('')}
      </section>`;
    }

    if (hasSales) {
      html += `<section>
        <div class="orders-section-title">My Sales</div>
        ${sales.map(order => orderRow(order, 'sale')).join('')}
      </section>`;
    }

    container.innerHTML = html;
  }

  function orderRow(order, type) {
    const img = order.listings?.images?.[0];
    const title = order.listings?.title || 'Item';
    const amount = type === 'sale'
      ? `You receive: $${Number(order.seller_payout).toLocaleString()}`
      : `$${Number(order.amount).toLocaleString()}`;

    const statusClass = {
      paid:      'status-paid',
      shipped:   'status-shipped',
      delivered: 'status-delivered',
      complete:  'status-complete',
      disputed:  'status-disputed'
    }[order.status] || 'status-pending';

    const statusLabel = {
      paid:      'Paid — Awaiting Shipment',
      shipped:   'Shipped',
      delivered: 'Delivered',
      complete:  'Complete',
      disputed:  'Disputed'
    }[order.status] || order.status;

    const date = new Date(order.created_at).toLocaleDateString();

    // Tracking display
    let trackingHtml = '';
    if (order.tracking_number) {
      const carrierLinks = {
        usps: `https://tools.usps.com/go/TrackConfirmAction?tLabels=${order.tracking_number}`,
        ups: `https://www.ups.com/track?tracknum=${order.tracking_number}`,
        fedex: `https://www.fedex.com/fedextrack/?trknbr=${order.tracking_number}`,
        dhl: `https://www.dhl.com/us-en/home/tracking.html?tracking-id=${order.tracking_number}`,
      };
      const trackUrl = carrierLinks[order.carrier] || '#';
      trackingHtml = `<div class="tracking-note">📦 <a href="${trackUrl}" target="_blank" style="color:var(--success);">${order.carrier?.toUpperCase() || ''} ${order.tracking_number}</a></div>`;
    }

    // Payout info for sellers
    let payoutHtml = '';
    if (type === 'sale') {
      if (order.payout_status === 'ready' || order.status === 'complete') {
        payoutHtml = `<div class="payout-ready">✅ Payout of $${Number(order.seller_payout).toLocaleString()} is being processed</div>`;
      } else if (order.payout_due_at) {
        const dueDate = new Date(order.payout_due_at).toLocaleDateString();
        const label = order.status === 'delivered' ? 'Buyer confirmed receipt —' : 'Auto-releases by';
        payoutHtml = `<div class="payout-note">${label} payout of $${Number(order.seller_payout).toLocaleString()} on ${dueDate}</div>`;
      }
    }

    // Delivery countdown for buyers
    let deliveryHtml = '';
    if (type === 'purchase' && order.status === 'delivered' && order.payout_due_at) {
      const daysLeft = Math.ceil((new Date(order.payout_due_at) - new Date()) / (1000 * 60 * 60 * 24));
      if (daysLeft > 0) {
        deliveryHtml = `<div class="payout-note">Funds release to seller in ${daysLeft} day${daysLeft !== 1 ? 's' : ''}</div>`;
      }
    }

    // Confirm received button — buyers only, when status is shipped
    let confirmHtml = '';
    if (type === 'purchase' && order.status === 'shipped') {
      confirmHtml = `
        <div style="margin-top:0.6rem;">
          <button class="confirm-received-btn" onclick="confirmDelivery('${order.id}')">✅ I received this order</button>
          <div id="confirm-alert-${order.id}" style="font-size:0.8rem;margin-top:0.25rem;"></div>
        </div>`;
    }

    // Dispute button/form
    let disputeHtml = '';
    if (order.status === 'disputed') {
      disputeHtml = `<div class="dispute-note">⚠️ Dispute filed: ${order.dispute_reason || ''}</div>`;
    } else if (type === 'purchase' && order.status === 'delivered') {
      // Buyer already confirmed receipt — gray out dispute button
      disputeHtml = `<button class="dispute-btn" disabled style="opacity:0.35;cursor:not-allowed;border-color:var(--muted);color:var(--muted);margin-top:0.5rem;">Flag a Problem</button>
        <div style="font-size:0.75rem;color:var(--muted);margin-top:0.2rem;">You confirmed receipt. Contact support if there's an issue.</div>`;
    } else if (['shipped', 'delivered'].includes(order.status)) {
      const role = type === 'purchase' ? 'buyer' : 'seller';
      disputeHtml = `
        <button class="dispute-btn" onclick="toggleDispute('${order.id}')">Flag a Problem</button>
        <div class="dispute-form" id="dispute-form-${order.id}" style="display:none">
          <select id="dispute-reason-${order.id}">
            <option value="">Select a reason…</option>
            ${role === 'buyer' ? `
            <option value="Item not received">Item not received</option>
            <option value="Item not as described">Item not as described</option>
            <option value="Item arrived damaged">Item arrived damaged</option>
            <option value="Wrong item sent">Wrong item sent</option>
            ` : `
            <option value="Buyer claims non-delivery">Buyer claims non-delivery</option>
            <option value="Buyer requesting return">Buyer requesting return</option>
            <option value="Fraudulent chargeback">Fraudulent chargeback</option>
            `}
            <option value="Other">Other</option>
          </select>
          <textarea id="dispute-details-${order.id}" placeholder="Describe the issue…"></textarea>
          <button onclick="submitDispute('${order.id}', '${role}')">Submit Dispute</button>
        </div>
        <div id="dispute-alert-${order.id}" style="font-size:0.8rem;margin-top:0.25rem;"></div>`;
    }

    // Add tracking form for sellers who haven't shipped yet
    const addTrackingHtml = (type === 'sale' && order.status === 'paid') ? `
      <div class="add-tracking-form">
        <select id="carrier-${order.id}">
          <option value="auto">Auto-detect carrier</option>
          <option value="usps">USPS</option>
          <option value="ups">UPS</option>
          <option value="fedex">FedEx</option>
          <option value="dhl-express">DHL</option>
          <option value="ontrac">OnTrac</option>
          <option value="lasership">LaserShip</option>
        </select>
        <input type="text" id="tracking-${order.id}" placeholder="Tracking number" />
        <button onclick="submitTracking('${order.id}')">Mark Shipped</button>
      </div>
      <div id="tracking-alert-${order.id}" style="font-size:0.8rem;margin-top:0.25rem;"></div>
    ` : '';

    const listingUrl = `listing.html?id=${order.listing_id}`;

    return `
      <div class="order-row" id="order-${order.id}">
        <a href="${listingUrl}" style="flex-shrink:0; display:block;">
          ${img
            ? `<img src="${img}" alt="${title}" style="display:block;" />`
            : `<div class="order-thumb-placeholder">🏍️</div>`}
        </a>
        <div class="order-info">
          <div class="order-title"><a href="${listingUrl}" style="color:inherit; text-decoration:none;">${title}</a></div>
          <div class="order-price">${amount}</div>
          <div class="order-meta">${date}</div>
          ${trackingHtml}
          ${payoutHtml}
          ${deliveryHtml}
          ${confirmHtml}
          ${addTrackingHtml}
          ${disputeHtml}
        </div>
        <span class="order-status ${statusClass}">${statusLabel}</span>
      </div>`;
  }

  async function submitTracking(orderId) {
    const trackingNumber = document.getElementById(`tracking-${orderId}`).value.trim();
    const carrier = document.getElementById(`carrier-${orderId}`).value;
    const alertEl = document.getElementById(`tracking-alert-${orderId}`);

    if (!trackingNumber) { alertEl.innerHTML = '<span style="color:var(--danger)">Enter a tracking number.</span>'; return; }

    alertEl.innerHTML = 'Saving...';

    const autoPayoutAt = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);

    const { error } = await supabase.from('orders').update({
      tracking_number: trackingNumber,
      carrier,
      status: 'shipped',
      payout_due_at: autoPayoutAt.toISOString(),
      payout_status: 'pending',
    }).eq('id', orderId);

    if (error) {
      alertEl.innerHTML = `<span style="color:var(--danger)">${error.message}</span>`;
    } else {
      alertEl.innerHTML = '<span style="color:var(--success)">Shipped! Tracking saved.</span>';
      supabase.functions.invoke('send-email', { body: { type: 'item_shipped', orderId } });
      setTimeout(() => load(), 1500);
    }
  }

  async function confirmDelivery(orderId) {
    if (!confirm('Confirm you received this order?\n\nThis will release the seller\'s payment in 3 days. Only confirm if the item has actually arrived.')) return;
    const alertEl = document.getElementById(`confirm-alert-${orderId}`);
    alertEl.innerHTML = 'Confirming...';

    const deliveredAt = new Date();
    const payoutDueAt = new Date(deliveredAt.getTime() + 3 * 24 * 60 * 60 * 1000);

    const { error } = await supabase.from('orders').update({
      status: 'delivered',
      delivered_at: deliveredAt.toISOString(),
      payout_due_at: payoutDueAt.toISOString(),
    }).eq('id', orderId);

    if (error) {
      alertEl.innerHTML = `<span style="color:var(--danger)">${error.message}</span>`;
    } else {
      alertEl.innerHTML = '<span style="color:var(--success)">Got it! Funds release to seller in 3 days.</span>';
      supabase.functions.invoke('send-email', { body: { type: 'delivery_confirmed', orderId } });
      setTimeout(() => load(), 1500);
    }
  }

  function toggleDispute(orderId) {
    const form = document.getElementById(`dispute-form-${orderId}`);
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  }

  async function submitDispute(orderId, role) {
    const reasonEl = document.getElementById(`dispute-reason-${orderId}`);
    const detailsEl = document.getElementById(`dispute-details-${orderId}`);
    const alertEl = document.getElementById(`dispute-alert-${orderId}`);

    const reason = reasonEl.value;
    const details = detailsEl.value.trim();
    if (!reason) { alertEl.innerHTML = '<span style="color:var(--danger)">Please select a reason.</span>'; return; }

    const fullReason = details ? `${reason} — ${details}` : reason;
    alertEl.innerHTML = 'Submitting…';

    const { error } = await supabase.from('orders').update({
      status: 'disputed',
      dispute_reason: fullReason,
      disputed_by: role,
    }).eq('id', orderId);

    if (error) {
      alertEl.innerHTML = `<span style="color:var(--danger)">${error.message}</span>`;
    } else {
      alertEl.innerHTML = '<span style="color:var(--danger)">Dispute submitted. Our team will review within 1 business day.</span>';
      supabase.functions.invoke('send-email', { body: { type: 'dispute_filed', orderId } });
      setTimeout(() => load(), 2000);
    }
  }

  load();
</script>
</body>
</html>
