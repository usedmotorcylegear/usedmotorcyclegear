<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listing — Used Motorcycle Gear</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">used<span>motorcyclegear</span>.com</a>
  <ul class="nav-links">
    <li><a href="browse.html">Browse</a></li>
    <li><a href="how-it-works.html">How It Works</a></li>
    <li id="nav-auth-link"><a href="auth.html">Sign In</a></li>
    <li id="nav-messages-link" style="display:none"><a href="inbox.html">Messages</a></li>
    <li id="nav-orders-link" style="display:none"><a href="orders.html">Orders</a></li>
    <li><a href="post.html" class="btn-nav">+ Sell Gear</a></li>
  </ul>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="listing-detail">
  <p style="margin-bottom:1.5rem;"><a href="browse.html" style="color:var(--muted); font-size:0.9rem;">&larr; Back to listings</a></p>
  <div id="content"><div class="loading">Loading listing...</div></div>
</div>

<footer>
  &copy; 2026 usedmotorcyclegear.com — Ride safe.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get('id');

  async function load() {
    const content = document.getElementById('content');

    if (!id) {
      content.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>No listing specified.</p></div>';
      return;
    }

    const { data: listing, error } = await supabase
      .from('listings')
      .select('*')
      .eq('id', id)
      .single();

    if (error || !listing) {
      content.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Listing not found.</p></div>';
      return;
    }

    const { data: profile } = await supabase
      .from('profiles')
      .select('username, full_name, location, phone')
      .eq('id', listing.user_id)
      .single();

    document.title = `${listing.title} — Used Motorcycle Gear`;

    const images = listing.images && listing.images.length > 0 ? listing.images : [];
    const mainImg = images[0] || null;

    const currentUser = await getUser();
    const isOwner = currentUser && currentUser.id === listing.user_id;

    content.innerHTML = `
      <div class="listing-detail-grid">
        <div>
          <div class="listing-images">
            ${mainImg
              ? `<img id="main-img" src="${mainImg}" alt="${listing.title}" />`
              : `<div style="width:100%;height:300px;background:var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:4rem;">🏍️</div>`}
            ${images.length > 1 ? `
              <div class="thumb-row">
                ${images.map((img, i) => `<img src="${img}" class="${i === 0 ? 'active' : ''}" onclick="setMain('${img}', this)" />`).join('')}
              </div>` : ''}
          </div>

          <div class="detail-section" style="margin-top:1.5rem;">
            <h3>Description</h3>
            <p>${listing.description ? listing.description.replace(/\n/g, '<br>') : 'No description provided.'}</p>
          </div>

          <div class="detail-section">
            <h3>Details</h3>
            <p>
              <strong>Category:</strong> ${listing.category}<br/>
              <strong>Condition:</strong> ${listing.condition}<br/>
              <strong>Location:</strong> ${listing.location || 'Not specified'}<br/>
              <strong>Posted:</strong> ${new Date(listing.created_at).toLocaleDateString()}
            </p>
          </div>

          ${isOwner ? `
            <div style="margin-top:1.5rem; display:flex; gap:0.75rem;">
              <a href="post.html?edit=${listing.id}" class="btn btn-outline">Edit Listing</a>
              <button class="btn btn-danger" onclick="deleteListing('${listing.id}')">Delete</button>
            </div>` : ''}
        </div>

        <div>
          <div class="seller-card">
            <div class="listing-detail-title">${listing.title}</div>
            <div class="listing-detail-price">$<span class="price-amount">${Number(listing.price).toLocaleString()}</span></div>
            <span class="badge">${listing.category}</span>
            <span class="badge">${listing.condition}</span>

            <h3 style="margin-bottom:0.75rem; font-size:0.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;">Seller</h3>
            <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:0.5rem;">
              <div class="seller-avatar">
                ${profile?.avatar_url
                  ? `<img src="${profile.avatar_url}" alt="${profile?.full_name || 'Seller'}" />`
                  : `${(profile?.full_name || profile?.username || '?').charAt(0).toUpperCase()}`}
              </div>
              <div>
                <div class="seller-name" style="margin-bottom:0;">${profile?.full_name || profile?.username || 'Anonymous'}</div>
                <div class="seller-location">${profile?.location || listing.location || ''}</div>
              </div>
            </div>

            <div id="contact-section"></div>
          </div>
        </div>
      </div>
    `;

    const contactEl = document.getElementById('contact-section');
    if (isOwner) {
      contactEl.innerHTML = '<p style="color:var(--muted); font-size:0.9rem;">This is your listing.</p>';
    } else if (currentUser) {
      contactEl.innerHTML = `
        <a href="checkout.html?id=${listing.id}" class="btn btn-primary btn-full" style="margin-bottom:0.6rem; display:block; text-align:center;">Buy Now — $${Number(listing.price).toLocaleString()}</a>
        <button id="offer-toggle-btn" class="btn btn-outline btn-full" style="margin-bottom:0.6rem;">Make an Offer</button>
        <div id="offer-form" style="display:none; margin-bottom:0.75rem;">
          <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem;">
            <span style="font-size:1rem; font-weight:700;">$</span>
            <input type="number" id="offer-amount" placeholder="Your offer" min="1" step="0.01" style="flex:1;" />
          </div>
          <button id="offer-submit-btn" class="btn btn-dark btn-full">Submit Offer</button>
          <div id="offer-alert" style="margin-top:0.5rem;"></div>
        </div>
        <div id="msg-form" style="margin-top:0.25rem;">
          <textarea id="msg-body" placeholder="Have a question? Message the seller..." style="width:100%; margin-bottom:0.6rem;"></textarea>
          <button id="send-btn" class="btn btn-outline btn-full">Send Message</button>
          <div id="msg-alert" style="margin-top:0.5rem;"></div>
        </div>`;

      document.getElementById('offer-toggle-btn').addEventListener('click', () => {
        const form = document.getElementById('offer-form');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
      });

      document.getElementById('offer-submit-btn').addEventListener('click', () => submitOffer(listing.user_id, listing.id));
      document.getElementById('send-btn').addEventListener('click', () => sendMessage(listing.user_id));
    } else {
      contactEl.innerHTML = `<a href="auth.html?next=listing.html%3Fid%3D${id}" class="btn btn-dark btn-full">Sign in to Buy or Message</a>`;
    }
  }

  function setMain(src, el) {
    document.getElementById('main-img').src = src;
    document.querySelectorAll('.thumb-row img').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }

  async function submitOffer(sellerId, listingId) {
    const amount = parseFloat(document.getElementById('offer-amount').value);
    const alertEl = document.getElementById('offer-alert');
    const btn = document.getElementById('offer-submit-btn');
    if (!amount || amount <= 0) {
      alertEl.innerHTML = '<div class="alert alert-error">Please enter a valid offer amount.</div>';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    const { data: { user } } = await supabase.auth.getUser();
    const { error } = await supabase.from('offers').insert({
      listing_id: listingId,
      buyer_id: user.id,
      seller_id: sellerId,
      amount
    });
    if (error) {
      alertEl.innerHTML = '<div class="alert alert-error">Failed to submit offer. Try again.</div>';
      btn.disabled = false;
      btn.textContent = 'Submit Offer';
    } else {
      document.getElementById('offer-form').innerHTML = '<div class="alert alert-success">Offer submitted! The seller will be in touch.</div>';
    }
  }

  async function sendMessage(recipientId) {
    const body = document.getElementById('msg-body').value.trim();
    const alertEl = document.getElementById('msg-alert');
    if (!body) { alertEl.innerHTML = '<div class="alert alert-error">Please write a message first.</div>'; return; }

    const { data: { user } } = await supabase.auth.getUser();
    const { error } = await supabase.from('messages').insert({
      listing_id: id,
      sender_id: user.id,
      recipient_id: recipientId,
      body
    });

    if (error) {
      alertEl.innerHTML = '<div class="alert alert-error">Failed to send. Please try again.</div>';
    } else {
      document.getElementById('msg-form').innerHTML = '<div class="alert alert-success">Message sent!</div>';
    }
  }

  async function deleteListing(id) {
    if (!confirm('Are you sure you want to delete this listing?')) return;
    const { error } = await supabase.from('listings').delete().eq('id', id);
    if (!error) window.location.href = 'account.html';
    else alert('Error deleting listing.');
  }

  load();
</script>
</body>
</html>
