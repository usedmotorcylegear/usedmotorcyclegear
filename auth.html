<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Used Motorcycle Gear</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 1.25rem;
    }
    .btn-google:hover { background: var(--bg); border-color: #aaa; }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">used<span>motorcyclegear</span>.com</a>
  <ul class="nav-links">
    <li><a href="browse.html">Browse</a></li>
    <li><a href="how-it-works.html">How It Works</a></li>
    <li><a href="post.html" class="btn-nav">+ Sell Gear</a></li>
  </ul>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="form-page">
  <div class="form-card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login', this)">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup', this)">Create Account</button>
    </div>

    <div id="alert"></div>

    <button type="button" class="btn-google" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908C16.658 12.075 17.64 9.767 17.64 9.2z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>
    <div class="auth-divider"><span>or</span></div>

    <!-- LOGIN -->
    <div id="tab-login" class="tab-content active">
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>
    </div>

    <!-- SIGNUP -->
    <div id="tab-signup" class="tab-content">
      <form id="signup-form">
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="signup-firstname" placeholder="John" required />
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="signup-lastname" placeholder="Doe" required />
          </div>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signup-username" placeholder="riderjohn" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  const nextPage = new URLSearchParams(window.location.search).get('next') || 'index.html';

  async function signInWithGoogle() {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/' + nextPage }
    });
    if (error) showAlert(error.message, 'error');
  }

  supabase.auth.getUser().then(({ data: { user } }) => {
    if (user) window.location.href = nextPage;
  });

  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    showAlert('', '');
  }

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.innerHTML = msg ? `<div class="alert alert-${type}">${msg}</div>` : '';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById('login-email').value,
      password: document.getElementById('login-password').value,
    });

    if (error) {
      showAlert(error.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    } else {
      window.location.href = nextPage;
    }
  });

  (function() {
    const hamburger = document.getElementById('nav-hamburger');
    if (!hamburger) return;
    const nav = document.querySelector('nav');
    hamburger.addEventListener('click', function(e) { e.stopPropagation(); nav.classList.toggle('nav-open'); });
    document.addEventListener('click', function(e) { if (!nav.contains(e.target)) nav.classList.remove('nav-open'); });
  })();

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    btn.textContent = 'Creating account...';

    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;
    const username = document.getElementById('signup-username').value.trim().toLowerCase();
    const fullName = `${document.getElementById('signup-firstname').value} ${document.getElementById('signup-lastname').value}`.trim();

    const { error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: { username, full_name: fullName } }
    });

    if (error) {
      showAlert(error.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    } else {
      showAlert('Account created! Check your email to confirm, then sign in.', 'success');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>

<footer>
  <div>&copy; 2026 usedmotorcyclegear.com &mdash; Ride safe.</div>
  <div style="margin-top:0.5rem;"><a href="terms.html">Terms of Service</a> &nbsp;&middot;&nbsp; <a href="privacy.html">Privacy Policy</a></div>
</footer>

</body>
</html>
