<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Used Motorcycle Gear</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    footer { display: none; }
    nav { position: relative !important; flex-shrink: 0; }

    .conversation-page {
      flex: 1;
      min-height: 0;
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    #content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .conversation-header {
      flex-shrink: 0;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .conversation-header .back { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 0.4rem; }
    .conversation-header h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.2rem; }
    .conversation-header .listing-link { font-size: 0.85rem; color: var(--primary); }

    .message-thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1.25rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .message-bubble { max-width: 75%; padding: 0.75rem 1rem; font-size: 0.95rem; line-height: 1.6; }
    .message-bubble.sent { align-self: flex-end; background: var(--text); color: #fff; }
    .message-bubble.received { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); color: var(--text); }
    .message-bubble .msg-meta { font-size: 0.72rem; opacity: 0.55; margin-top: 0.35rem; }

    #reply-alert { flex-shrink: 0; padding: 0 2rem 0.25rem; }

    .reply-box {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      padding: 0.75rem 2rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      background: #fff;
    }
    .reply-box textarea {
      flex: 1;
      margin: 0;
      min-height: 44px;
      max-height: 120px;
      resize: none;
    }
    .reply-box .btn { flex-shrink: 0; padding: 0.7rem 1.25rem; }

    @media (max-width: 768px) {
      .conversation-header { padding: 0.75rem 1.25rem; }
      .message-thread { padding: 0.75rem 1.25rem; }
      .reply-box { padding: 0.75rem 1.25rem; }
      #reply-alert { padding: 0 1.25rem 0.25rem; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">used<span>motorcyclegear</span>.com</a>
  <ul class="nav-links">
    <li><a href="browse.html">Browse</a></li>
    <li><a href="how-it-works.html">How It Works</a></li>
    <li id="nav-auth-link"><a href="auth.html">Sign In</a></li>
    <li id="nav-messages-link" style="display:none"><a href="inbox.html">Messages</a></li>
    <li id="nav-orders-link" style="display:none"><a href="orders.html">Orders</a></li>
    <li><a href="post.html" class="btn-nav">+ Sell Gear</a></li>
  </ul>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="conversation-page">
  <div id="content"><div class="loading" style="margin:auto;">Loading conversation...</div></div>
</div>

<footer>&copy; 2026 usedmotorcyclegear.com — Ride safe.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const listingId = params.get('listing');
  const withUserId = params.get('with');
  let currentUser = null;

  async function load() {
    currentUser = await requireAuth();
    const content = document.getElementById('content');

    const { data: listing } = await supabase.from('listings').select('title, id').eq('id', listingId).single();
    const { data: otherProfile } = await supabase.from('profiles').select('full_name, username').eq('id', withUserId).single();
    const otherName = otherProfile?.full_name || otherProfile?.username || 'User';

    const { data: messages } = await supabase
      .from('messages')
      .select('*')
      .eq('listing_id', listingId)
      .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`)
      .order('created_at', { ascending: true });

    const unread = (messages || []).filter(m => m.recipient_id === currentUser.id && !m.read).map(m => m.id);
    if (unread.length > 0) {
      await supabase.from('messages').update({ read: true }).in('id', unread);
    }

    content.innerHTML = `
      <div class="conversation-header">
        <a class="back" href="inbox.html">&larr; Back to messages</a>
        <h2>${otherName}</h2>
        ${listing ? `<a class="listing-link" href="listing.html?id=${listing.id}">Re: ${listing.title}</a>` : ''}
      </div>
      <div class="message-thread" id="thread">
        ${(messages || []).length === 0 ? '<p style="color:var(--muted);font-size:0.9rem;text-align:center;margin:auto;">No messages yet.</p>' : ''}
        ${(messages || []).map(m => {
          const sent = m.sender_id === currentUser.id;
          return `<div class="message-bubble ${sent ? 'sent' : 'received'}">
              ${m.body}
              <div class="msg-meta">${new Date(m.created_at).toLocaleString()}</div>
            </div>`;
        }).join('')}
      </div>
      <div id="reply-alert"></div>
      <div class="reply-box">
        <textarea id="reply-body" placeholder="Write a reply..." rows="2"></textarea>
        <button id="reply-btn" class="btn btn-dark">Send</button>
      </div>
    `;

    const thread = document.getElementById('thread');
    thread.scrollTop = thread.scrollHeight;

    document.getElementById('reply-btn').addEventListener('click', sendReply);
    document.getElementById('reply-body').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
    });
  }

  async function sendReply() {
    const body = document.getElementById('reply-body').value.trim();
    const alertEl = document.getElementById('reply-alert');
    const btn = document.getElementById('reply-btn');
    if (!body) return;

    btn.disabled = true;
    btn.textContent = 'Sending...';

    const { error } = await supabase.from('messages').insert({
      listing_id: listingId,
      sender_id: currentUser.id,
      recipient_id: withUserId,
      body
    });

    if (error) {
      alertEl.innerHTML = '<div class="alert alert-error">Failed to send. Try again.</div>';
      btn.disabled = false;
      btn.textContent = 'Send';
    } else {
      document.getElementById('reply-body').value = '';
      btn.disabled = false;
      btn.textContent = 'Send';
      alertEl.innerHTML = '';
      const thread = document.getElementById('thread');
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble sent';
      bubble.innerHTML = `${body}<div class="msg-meta">Just now</div>`;
      thread.appendChild(bubble);
      thread.scrollTop = thread.scrollHeight;
    }
  }

  load();
</script>
</body>
</html>
