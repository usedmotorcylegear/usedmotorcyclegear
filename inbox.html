<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Used Motorcycle Gear</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .inbox-page { max-width: 720px; margin: 3rem auto; padding: 0 1.5rem; }
    .inbox-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--text);
    }
    .conversation-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background 0.1s;
    }
    .conversation-row:hover { background: var(--bg); margin: 0 -1rem; padding: 1.1rem 1rem; }
    .conv-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--text);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .conv-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.15rem; }
    .conv-listing { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-preview { font-size: 0.88rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-right { text-align: right; flex-shrink: 0; }
    .conv-date { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.4rem; }
    .conv-unread {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
    }
    .unread-row .conv-name, .unread-row .conv-preview { color: var(--text); font-weight: 700; }
    .empty-inbox { padding: 4rem 0; text-align: center; color: var(--muted); }
    .empty-inbox p { margin-bottom: 1.25rem; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">used<span>motorcyclegear</span>.com</a>
  <ul class="nav-links">
    <li><a href="browse.html">Browse</a></li>
    <li id="nav-auth-link"><a href="auth.html">Sign In</a></li>
    <li id="nav-messages-link" style="display:none"><a href="inbox.html">Messages</a></li>
    <li id="nav-orders-link" style="display:none"><a href="orders.html">Orders</a></li>
    <li><a href="post.html" class="btn-nav">+ Sell Gear</a></li>
  </ul>
</nav>

<div class="inbox-page">
  <div class="inbox-title">Messages</div>
  <div id="inbox-content"><div class="loading">Loading...</div></div>
</div>

<footer>&copy; 2026 usedmotorcyclegear.com — Ride safe.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  async function load() {
    const user = await requireAuth();
    const container = document.getElementById('inbox-content');

    const { data: messages, error } = await supabase
      .from('messages')
      .select('*, listings(title, id)')
      .or(`recipient_id.eq.${user.id},sender_id.eq.${user.id}`)
      .order('created_at', { ascending: false });

    if (error || !messages || messages.length === 0) {
      container.innerHTML = `<div class="empty-inbox"><p>No messages yet.</p><a href="browse.html" class="btn btn-primary">Browse Listings</a></div>`;
      return;
    }

    // Deduplicate into unique conversations
    const seen = new Set();
    const conversations = messages.filter(msg => {
      const otherId = msg.sender_id === user.id ? msg.recipient_id : msg.sender_id;
      const key = `${msg.listing_id}-${otherId}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    // Load other user profiles
    const otherIds = [...new Set(conversations.map(m => m.sender_id === user.id ? m.recipient_id : m.sender_id))];
    const { data: profiles } = await supabase.from('profiles').select('id, full_name, username, avatar_url').in('id', otherIds);
    const profileMap = Object.fromEntries((profiles || []).map(p => [p.id, p]));

    // Count unread per conversation
    const unreadMap = {};
    messages.forEach(m => {
      if (m.recipient_id === user.id && !m.read) {
        const otherId = m.sender_id;
        const key = `${m.listing_id}-${otherId}`;
        unreadMap[key] = (unreadMap[key] || 0) + 1;
      }
    });

    container.innerHTML = conversations.map(msg => {
      const otherId = msg.sender_id === user.id ? msg.recipient_id : msg.sender_id;
      const profile = profileMap[otherId];
      const name = profile?.full_name || profile?.username || 'User';
      const initial = name.charAt(0).toUpperCase();
      const avatar = profile?.avatar_url
        ? `<img src="${profile.avatar_url}" alt="${name}" />`
        : initial;
      const key = `${msg.listing_id}-${otherId}`;
      const unread = unreadMap[key] || 0;
      const date = new Date(msg.created_at).toLocaleDateString();

      return `
        <a href="messages.html?listing=${msg.listing_id}&with=${otherId}" class="conversation-row ${unread ? 'unread-row' : ''}">
          <div class="conv-avatar">${avatar}</div>
          <div class="conv-info">
            <div class="conv-name">${name}</div>
            <div class="conv-listing">Re: ${msg.listings?.title || 'Listing'}</div>
            <div class="conv-preview">${msg.body}</div>
          </div>
          <div class="conv-right">
            <div class="conv-date">${date}</div>
            ${unread ? `<span class="conv-unread">${unread} new</span>` : ''}
          </div>
        </a>`;
    }).join('');
  }

  load();
</script>
</body>
</html>
