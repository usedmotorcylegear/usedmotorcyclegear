<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Used Motorcycle Gear</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .checkout-page { max-width: 560px; margin: 3rem auto; padding: 0 1.5rem; }
    .checkout-card { background: #fff; border: 1px solid var(--border); padding: 2rem; }
    .checkout-card h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 1.75rem; letter-spacing: -0.02em; }
    .checkout-item { display: flex; gap: 1rem; align-items: center; padding-bottom: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .checkout-item img, .checkout-item .no-img { width: 90px; height: 68px; object-fit: cover; flex-shrink: 0; background: var(--bg); }
    .checkout-item-info { flex: 1; }
    .checkout-item-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.25rem; }
    .checkout-item-meta { font-size: 0.82rem; color: var(--muted); }
    .price-row { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 0.75rem; }
    .price-row.total { font-weight: 800; font-size: 1.1rem; border-top: 1px solid var(--border); padding-top: 0.75rem; margin-top: 0.25rem; }
    .price-row .muted { color: var(--muted); font-size: 0.85rem; }
    .stripe-btn { margin-top: 1.5rem; }
    .secure-note { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 0.75rem; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">used<span>motorcyclegear</span>.com</a>
  <ul class="nav-links">
    <li><a href="browse.html">Browse</a></li>
    <li><a href="how-it-works.html">How It Works</a></li>
    <li id="nav-auth-link"><a href="auth.html">Sign In</a></li>
    <li id="nav-messages-link" style="display:none"><a href="inbox.html">Messages</a></li>
    <li id="nav-orders-link" style="display:none"><a href="orders.html">Orders</a></li>
    <li><a href="post.html" class="btn-nav">+ Sell Gear</a></li>
  </ul>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="checkout-page">
  <p style="margin-bottom:1.5rem;"><a id="back-link" href="browse.html" style="color:var(--muted); font-size:0.9rem;">&larr; Back to listing</a></p>
  <div class="checkout-card">
    <h2>Complete Your Purchase</h2>
    <div id="content"><div class="loading">Loading...</div></div>
  </div>
</div>

<footer>
  <div>&copy; 2026 usedmotorcyclegear.com &mdash; Ride safe.</div>
  <div style="margin-top:0.5rem;"><a href="terms.html">Terms of Service</a> &nbsp;&middot;&nbsp; <a href="privacy.html">Privacy Policy</a></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  const listingId = new URLSearchParams(window.location.search).get('id');
  const offerPrice = new URLSearchParams(window.location.search).get('offer');
  const FEE_RATE = 0.1333;

  async function load() {
    await requireAuth();
    const content = document.getElementById('content');

    const { data: listing } = await supabase.from('listings').select('*').eq('id', listingId).single();
    if (!listing) { content.innerHTML = '<p>Listing not found.</p>'; return; }

    document.getElementById('back-link').href = `listing.html?id=${listingId}`;
    const price = offerPrice ? Number(offerPrice) : Number(listing.price);
    const fee = +(price * FEE_RATE).toFixed(2);
    const sellerGets = +(price - fee).toFixed(2);

    content.innerHTML = `
      <div class="checkout-item">
        ${listing.images && listing.images.length > 0
          ? `<img src="${listing.images[0]}" alt="${listing.title}" />`
          : `<div class="no-img"></div>`}
        <div class="checkout-item-info">
          <div class="checkout-item-title">${listing.title}</div>
          <div class="checkout-item-meta">${listing.category} &middot; ${listing.condition}</div>
        </div>
      </div>

      ${offerPrice ? `<div class="price-row" style="color:var(--success);"><span>Accepted offer price</span><span>$${price.toLocaleString()}</span></div>` : `<div class="price-row"><span>Item price</span><span>$${price.toLocaleString()}</span></div>`}
      <div class="price-row"><span class="muted">Buyer protection fee</span><span class="muted">$0.00</span></div>
      <div class="price-row total"><span>Total</span><span>$${price.toLocaleString()}</span></div>

      <div class="form-group" style="margin-top:1.25rem;">
        <label style="font-size:0.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:0.4rem;">Referral Code <span style="font-weight:400;text-transform:none;">(optional)</span></label>
        <input type="text" id="referral-code" placeholder="e.g. RIDERJO" style="text-transform:uppercase;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:0.7rem 1rem;width:100%;font-size:1rem;" />
        <p style="font-size:0.8rem;color:var(--muted);margin-top:0.35rem;">Have an influencer's code? Enter it here — they earn 5% of this sale.</p>
      </div>

      <div id="pay-alert"></div>

      <button id="pay-btn" class="btn btn-dark btn-full stripe-btn" onclick="handlePay('${listing.id}', '${listing.user_id}', ${price}, '${listing.title.replace(/'/g, "\\'")}')">
        Pay $${price.toLocaleString()} with Stripe
      </button>
      <p class="secure-note">🔒 Secure payment via Stripe. Funds held for 3 days after delivery before seller is paid.</p>
    `;
  }

  async function handlePay(listingId, sellerId, amount, listingTitle) {
    const btn = document.getElementById('pay-btn');
    const alertEl = document.getElementById('pay-alert');
    const referralCode = (document.getElementById('referral-code')?.value || '').trim().toLowerCase() || null;
    const referralPayout = referralCode ? +(amount * 0.05).toFixed(2) : 0;

    btn.disabled = true;
    btn.textContent = 'Redirecting to Stripe...';

    try {
      const { data: { user } } = await supabase.auth.getUser();
      const { data, error } = await supabase.functions.invoke('create-checkout-session', {
        body: { listingId, sellerId, buyerId: user.id, amount, referralCode, referralPayout, listingTitle }
      });

      if (error || !data?.url) throw new Error(error?.message || 'Failed to create checkout session');
      window.location.href = data.url;
    } catch (err) {
      alertEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      btn.disabled = false;
      btn.textContent = `Pay $${Number(amount).toLocaleString()} with Stripe`;
    }
  }

  load();
</script>
</body>
</html>
