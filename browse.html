  <meta property="og:description" content="Browse used motorcycle jackets, pants, boots, gloves and more. All gear certified never crashed." />
  <meta property="og:url" content="https://www.usedmotorcyclegear.com/browse.html" />

<body>

</div>

<div class="browse-layout">
  <div class="browse-header">
    <input type="text" class="search-bar" id="search" placeholder="Search listings..." />
    <select class="filter-select" id="sort-filter">
      <option value="created_at">Newest First</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
    </select>
  </div>

  <div id="results-count" style="color:var(--muted); font-size:0.9rem; margin-bottom:1rem;"></div>
  <div id="listings-grid" class="listings-grid">
    <div class="loading">Loading listings...</div>
  </div>
</div>

<footer>
  <div>&copy; 2026 usedmotorcyclegear.com &mdash; Ride safe.</div>
  <div style="margin-top:0.5rem;"><a href="terms.html">Terms of Service</a> &nbsp;&middot;&nbsp; <a href="privacy.html">Privacy Policy</a></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const categoryParam = params.get('category') || '';
  const sortFilter = document.getElementById('sort-filter');
  const searchInput = document.getElementById('search');

  let debounceTimer;

  async function loadListings() {
    const grid = document.getElementById('listings-grid');
    const count = document.getElementById('results-count');
    grid.innerHTML = '<div class="loading">Loading...</div>';

    const category = categoryParam;
    const sort = sortFilter.value;
    const search = searchInput.value.trim();

    let query = supabase
      .from('listings')
      .select('*')
      .eq('status', 'active');

    if (category) query = query.eq('category', category);
    if (search) query = query.ilike('title', `%${search}%`);

    if (sort === 'price_asc') query = query.order('price', { ascending: true });
    else if (sort === 'price_desc') query = query.order('price', { ascending: false });
    else query = query.order('created_at', { ascending: false });

    const { data, error } = await query;

    if (error) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Error loading listings.</p></div>';
      return;
    }

    count.textContent = `${data.length} listing${data.length !== 1 ? 's' : ''} found`;

    if (data.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="icon">🔍</div>
          <p>No listings match your search.</p>
          <a href="post.html" class="btn btn-primary">Be the first to sell!</a>
        </div>`;
      return;
    }

    grid.innerHTML = data.map(listing => `
      <a href="listing.html?id=${listing.id}" class="listing-card">
        ${listing.images && listing.images.length > 0
          ? `<img src="${listing.images[0]}" alt="${escapeHtml(listing.title)}" loading="lazy" />`
          : `<div class="placeholder-img">🏍️</div>`}
        <div class="listing-info">
          <div class="listing-title">${escapeHtml(listing.title)}</div>
          <div class="listing-price">$${Number(listing.price).toLocaleString()}</div>
          <div class="listing-meta">${escapeHtml(listing.category)} &middot; ${escapeHtml(listing.condition)} &middot; ${escapeHtml(listing.location || 'No location')}</div>
        </div>
      </a>
    `).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  sortFilter.addEventListener('change', loadListings);
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadListings, 350);
  });

  // Track page view (once per session per page)
  (function() {
    const page = location.pathname.split('/').pop().replace('.html','') || 'home';
    if (sessionStorage.getItem('pv_'+page)) return;
    sessionStorage.setItem('pv_'+page, '1');
    const ref = document.referrer ? (() => { try { return new URL(document.referrer).hostname; } catch(e) { return 'direct'; } })() : 'direct';
    supabase.from('page_views').insert({ page, referrer: ref });
  })();

  loadListings();
</script>
</body>
</html>
